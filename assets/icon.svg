<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23"/>
      <stop offset="100%" stop-color="#111216"/>
    </linearGradient>

    <!-- Electric Cyan/Blue Stream Gradient -->
    <linearGradient id="stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Subtle Soft Glow -->
    <filter id="pip-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Container (Fits Windows & Modern Desktop App standards) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#2B2F3A" stroke-width="3"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- Architectural 'L' Base Frame (Refined Steel Slate) -->
  <path d="M 148,136 L 148,376 L 364,376" fill="none" stroke="#4B5565" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner 'E' Kinetic Streaming Rails (Electric Cyan/Blue) -->
  <g stroke="url(#stream)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical Spine -->
    <line x1="208" y1="196" x2="208" y2="316"/>
    <!-- Top Rail -->
    <line x1="208" y1="196" x2="340" y2="196"/>
    <!-- Middle Dynamic Rail -->
    <line x1="208" y1="256" x2="304" y2="256"/>
    <!-- Bottom Rail -->
    <line x1="208" y1="316" x2="348" y2="316"/>
  </g>

  <!-- Cryptographic Integrity Pip (Bitwise Verification Green) -->
  <circle cx="356" cy="136" r="15" fill="#10B981" filter="url(#pip-glow)"/>
</svg>